<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0e13" />
<title>Hybrid Gorilla 4.0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b0e13'/%3E%3Ctext x='50' y='62' font-size='58' text-anchor='middle'%3E%F0%9F%A6%8D%3C/text%3E%3Crect x='18' y='82' width='64' height='7' rx='3.5' fill='%23ff2a6d'/%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0b0e13;
  --bg-elev: #12161d;
  --bg-elev-2: #1a202a;
  --border: #222b36;
  --border-strong: #37424f;
  --text: #e8edf2;
  --text-muted: #8b98a8;
  --text-dim: #5c6673;
  --accent: #ff2a6d;
  --heavy: #ff2a6d;
  --moderate: #f5d90a;
  --pump: #b967ff;
  --quality: #05d9e8;
  --easy: #00e0a4;
  --rest: #66707d;
  --warn: #f5d90a;
  --radius: 14px;
  --radius-s: 8px;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --display: "Oswald", "Impact", sans-serif;
  --body: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--body); -webkit-font-smoothing:antialiased; }
body { min-height:100vh; min-height:100dvh; overscroll-behavior-y:contain; padding-bottom:env(safe-area-inset-bottom); }
.app { max-width:640px; margin:0 auto; padding:0 16px 120px; }

header.top {
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg, var(--bg) 70%, rgba(11,14,19,0.94) 100%);
  padding:20px 16px 12px; margin:0 -16px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.brand-row { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.brand { font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:.06em; line-height:1; text-transform:uppercase; }
.brand .accent { color:var(--accent); text-shadow:0 0 14px rgba(255,42,109,.55); }
.blockchip { font-family:var(--mono); font-size:11px; color:var(--text-muted); text-align:right; letter-spacing:.04em; }
.blockchip strong { display:block; color:var(--text); font-size:15px; font-family:var(--display); font-weight:600; letter-spacing:.05em; text-transform:uppercase; }
.status-bar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:10px; font-family:var(--mono); font-size:10.5px; color:var(--text-muted); letter-spacing:.04em; text-transform:uppercase; }
.status-bar .sep { color:var(--text-dim); }
.progress-track { margin-top:10px; height:5px; background:var(--bg-elev); border-radius:3px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--pump)); border-radius:3px; transition:width .3s; }

nav.tabs { display:flex; gap:4px; margin:14px -16px 0; padding:0 16px; overflow-x:auto; scrollbar-width:none; }
nav.tabs::-webkit-scrollbar { display:none; }
.tab { flex:1 0 auto; padding:9px 14px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text-muted);
  border-radius:var(--radius-s); font-family:var(--display); font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; white-space:nowrap; }
.tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }

main { margin-top:18px; }
.card { background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
.card.today { border-color:var(--accent); box-shadow:0 0 0 1px rgba(255,42,109,.25), var(--shadow); }
.card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:4px; }
.day-name { font-family:var(--display); font-size:19px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; line-height:1.1; }
.day-sub { font-size:12.5px; color:var(--text-muted); margin-top:3px; }
.pill { font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; padding:4px 8px; border-radius:20px; border:1px solid; white-space:nowrap; }
.p-heavy { color:var(--heavy); border-color:rgba(255,42,109,.45); background:rgba(255,42,109,.10); }
.p-pump { color:var(--pump); border-color:rgba(185,103,255,.45); background:rgba(185,103,255,.10); }
.p-mod { color:var(--moderate); border-color:rgba(245,217,10,.4); background:rgba(245,217,10,.08); }
.p-easy { color:var(--easy); border-color:rgba(0,224,164,.4); background:rgba(0,224,164,.09); }
.p-quality { color:var(--quality); border-color:rgba(5,217,232,.4); background:rgba(5,217,232,.09); }
.p-deload { color:var(--warn); border-color:rgba(245,217,10,.5); background:rgba(245,217,10,.10); }

.runline { margin-top:12px; padding:10px 12px; background:var(--bg-elev-2); border-radius:var(--radius-s); border-left:3px solid var(--easy); font-size:13px; }
.runline.quality { border-left-color:var(--quality); }
.runline.long { border-left-color:var(--pump); }
.runline b { font-family:var(--display); letter-spacing:.05em; text-transform:uppercase; font-size:12px; color:var(--text-muted); display:block; margin-bottom:3px; }
.runline .zone { font-family:var(--mono); font-size:11.5px; color:var(--text-muted); margin-top:4px; }

.btn { display:block; width:100%; margin-top:12px; padding:12px; border-radius:var(--radius-s); border:1px solid var(--border-strong);
  background:var(--bg-elev-2); color:var(--text); font-family:var(--display); font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.done { background:rgba(0,224,164,.12); border-color:var(--easy); color:var(--easy); }

.modemenu { display:flex; gap:6px; margin:0 0 14px; }
.mode-btn { flex:1; padding:9px 4px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text-muted);
  border-radius:var(--radius-s); font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; }
.mode-btn.on { background:var(--bg-elev-2); border-color:var(--accent); color:var(--accent); }

.blk { border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; background:var(--bg-elev); }
.blk-head { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--bg-elev-2); border-bottom:1px solid var(--border); }
.blk-letter { font-family:var(--display); font-size:30px; font-weight:700; line-height:1; color:var(--accent); opacity:.9; width:26px; text-align:center; }
.blk-meta { flex:1; min-width:0; }
.blk-type { font-family:var(--display); font-size:14px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; }
.blk-rest { font-family:var(--mono); font-size:10.5px; color:var(--text-muted); margin-top:2px; }
.blk-target { font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-dim); padding:7px 14px; border-bottom:1px solid var(--border); background:rgba(0,0,0,.18); }
.ex { padding:12px 14px; border-bottom:1px solid var(--border); }
.ex:last-child { border-bottom:none; }
.ex-top { display:flex; gap:10px; align-items:flex-start; }
.ex-ord { font-family:var(--mono); font-size:11px; color:var(--text-dim); width:16px; flex:none; padding-top:2px; }
.ex-name { font-weight:600; font-size:14.5px; line-height:1.3; }
.ex-alt { font-size:11.5px; color:var(--text-dim); margin-top:3px; font-style:italic; }
.ex-pres { font-family:var(--mono); font-size:11.5px; color:var(--text-muted); margin-top:5px; }
.ex-note { font-size:11.5px; color:var(--moderate); margin-top:5px; }

.rounds { margin-top:10px; margin-left:26px; display:flex; flex-direction:column; gap:5px; }
.rnd { display:flex; align-items:center; gap:9px; padding:7px 10px; background:var(--bg-elev-2); border:1px solid var(--border); border-radius:var(--radius-s); cursor:pointer; }
.rnd.on { border-color:var(--easy); background:rgba(0,224,164,.08); }
.rnd-n { font-family:var(--mono); font-size:10px; color:var(--text-dim); width:24px; flex:none; }
.rnd-reps { font-family:var(--display); font-size:15px; font-weight:600; width:44px; flex:none; letter-spacing:.03em; }
.rnd-eff { font-size:11.5px; color:var(--text-muted); flex:1; line-height:1.25; }
.rnd.peak .rnd-reps { color:var(--accent); }
.rnd-box { width:17px; height:17px; border-radius:4px; border:1.5px solid var(--border-strong); flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--bg); }
.rnd.on .rnd-box { background:var(--easy); border-color:var(--easy); }

.track { display:flex; gap:10px; align-items:center; margin-top:10px; margin-left:26px; }
.track input[type=number] { width:78px; padding:7px 8px; background:var(--bg); border:1px solid var(--border-strong); border-radius:6px; color:var(--text); font-family:var(--mono); font-size:13px; }
.track label { font-family:var(--mono); font-size:10px; color:var(--text-dim); letter-spacing:.05em; text-transform:uppercase; }

.intens { margin:0 0 12px; padding:11px 13px; border-radius:var(--radius-s); border:1px solid rgba(185,103,255,.4); background:rgba(185,103,255,.09); font-size:12.5px; line-height:1.45; }
.intens b { font-family:var(--display); letter-spacing:.06em; text-transform:uppercase; color:var(--pump); font-size:12px; display:block; margin-bottom:3px; }
.warnbox { margin:0 0 12px; padding:11px 13px; border-radius:var(--radius-s); border:1px solid rgba(245,217,10,.4); background:rgba(245,217,10,.08); font-size:12.5px; line-height:1.45; }
.warnbox b { font-family:var(--display); letter-spacing:.06em; text-transform:uppercase; color:var(--warn); font-size:12px; display:block; margin-bottom:3px; }

textarea.notes { width:100%; margin-top:12px; min-height:70px; padding:10px; background:var(--bg); border:1px solid var(--border-strong); border-radius:var(--radius-s); color:var(--text); font-family:var(--body); font-size:13.5px; resize:vertical; }

h2.sec { font-family:var(--display); font-size:13px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin:22px 0 10px; }
.wktable { width:100%; border-collapse:collapse; font-size:12.5px; }
.wktable td { padding:8px 6px; border-bottom:1px solid var(--border); vertical-align:top; }
.wktable td:first-child { font-family:var(--mono); font-size:10.5px; color:var(--text-dim); width:38px; text-transform:uppercase; }
.wktable tr.now td { background:rgba(255,42,109,.07); }
.wktable tr.now td:first-child { color:var(--accent); }

.blockgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.wkcell { padding:10px 6px; border:1px solid var(--border); border-radius:var(--radius-s); text-align:center; background:var(--bg-elev); }
.wkcell .n { font-family:var(--display); font-size:16px; font-weight:600; }
.wkcell .v { font-family:var(--mono); font-size:9.5px; color:var(--text-muted); margin-top:2px; }
.wkcell.now { border-color:var(--accent); background:rgba(255,42,109,.1); }
.wkcell.dl { border-color:var(--warn); background:rgba(245,217,10,.08); }
.wkcell.dl .v { color:var(--warn); }

.ref p { font-size:13.5px; line-height:1.55; color:var(--text-muted); }
.ref .lad { display:flex; flex-direction:column; gap:5px; margin:10px 0; }
.ref .lad-row { display:flex; gap:10px; align-items:baseline; padding:8px 11px; background:var(--bg-elev-2); border-radius:6px; border-left:3px solid var(--border-strong); }
.ref .lad-row b { font-size:13px; min-width:0; }
.ref .lad-row span { font-size:11.5px; color:var(--text-muted); }
.ref .lad-row.l6 { border-left-color:var(--accent); }
.ref .lad-row.l5 { border-left-color:#ff6b3d; }
.ref .lad-row.l4 { border-left-color:var(--moderate); }
.ref .lad-row.l3 { border-left-color:var(--quality); }
.ref .lad-row.l2, .ref .lad-row.l1 { border-left-color:var(--easy); }

.tt { display:flex; gap:10px; align-items:center; margin-top:10px; }
.tt input { flex:1; padding:9px 10px; background:var(--bg); border:1px solid var(--border-strong); border-radius:6px; color:var(--text); font-family:var(--mono); font-size:14px; }

.modal { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; z-index:100; overflow-y:auto; padding:20px 0; }
.modal.open { display:block; }
.modal-inner { max-width:640px; margin:0 auto; padding:0 14px; }
.modal-card { background:var(--bg-elev); border:1px solid var(--border-strong); border-radius:var(--radius); padding:16px; }
.modal-x { position:sticky; top:0; float:right; background:var(--bg-elev-2); border:1px solid var(--border-strong); color:var(--text); width:32px; height:32px; border-radius:50%; font-size:17px; cursor:pointer; z-index:2; }
.foot { text-align:center; font-family:var(--mono); font-size:10px; color:var(--text-dim); padding:24px 0 8px; letter-spacing:.05em; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-row">
      <div class="brand">Hybrid <span class="accent">Gorilla</span> 4.0</div>
      <div class="blockchip" id="chip"></div>
    </div>
    <div class="status-bar" id="status"></div>
    <div class="progress-track"><div class="progress-fill" id="prog" style="width:0%"></div></div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
  <div class="foot">Hybrid Gorilla 4.0 · block programming · <span id="footdate"></span></div>
</div>

<div class="modal" id="modal"><div class="modal-inner">
  <button class="modal-x" onclick="closeModal()">✕</button>
  <div class="modal-card" id="modalContent"></div>
</div></div>

<script>
/* ============================================================
   HYBRID GORILLA 4.0
   Lifting rebuilt on block programming. Running carried from 3.0.
   Storage: hybrid-gorilla-v4  (3.0 data untouched)
   ============================================================ */

const LIFT_ANCHOR = new Date(2026, 8, 14);  // Mon Sep 14 2026 — fresh lift anchor
const RUN_ANCHOR  = new Date(2026, 7, 17);  // Mon Aug 17 2026 — unchanged from 3.0
const RAMP_WEEKS  = 4;                       // on-ramp: V1–V4, V4 as deload, no intensifiers
const BLOCK_WEEKS = 8;

/* ---------- wave shape library ---------- */
const WAVES = {
  classic: { name:'Classic Wave', drop:[0], rounds:[
    {reps:'12', eff:'Medium'}, {reps:'10', eff:'Medium Plus'},
    {reps:'8', eff:'Heavy'}, {reps:'6', eff:'As Heavy as Possible', peak:1} ]},
  ramp: { name:'Ramp', drop:[1], rounds:[
    {reps:'10', eff:'Medium'}, {reps:'10', eff:'Medium Plus'}, {reps:'10', eff:'Medium Plus'},
    {reps:'10', eff:'Heavy'}, {reps:'10', eff:'Heavy', peak:1} ]},
  pyramid: { name:'Pyramid', drop:[5], rounds:[
    {reps:'12', eff:'Medium'}, {reps:'10', eff:'Medium Plus'}, {reps:'8', eff:'Heavy'},
    {reps:'5', eff:'As Heavy as Possible', peak:1}, {reps:'8', eff:'Heavy'},
    {reps:'10', eff:'same weight as round 2'} ]},
  double: { name:'Double Wave', drop:[3], rounds:[
    {reps:'12', eff:'Medium'}, {reps:'10', eff:'Medium Plus'}, {reps:'6', eff:'Heavy', peak:1},
    {reps:'10', eff:'Medium Plus'}, {reps:'8', eff:'Heavy'},
    {reps:'5', eff:'As Heavy as Possible', peak:1} ]},
  auto: { name:'Autoregulated Ascent', drop:[], auto:1, rounds:[
    {reps:'12', eff:'add load'}, {reps:'12', eff:'add load'}, {reps:'12', eff:'add load'},
    {reps:'12', eff:'add load'}, {reps:'12', eff:'stop when 12 is unreachable'} ]},
  iso: { name:'Isolation Wave', drop:[], rounds:[
    {reps:'25', eff:'Medium'}, {reps:'20', eff:'Medium Plus'}, {reps:'15', eff:'Heavy'},
    {reps:'10', eff:'As Heavy as Possible — to failure', peak:1} ]},
  isoArms: { name:'Isolation Wave', drop:[], rounds:[
    {reps:'20', eff:'Medium'}, {reps:'15', eff:'Medium Plus'}, {reps:'12', eff:'Heavy'},
    {reps:'10', eff:'As Heavy as Possible — to failure', peak:1} ]}
};

/* ---------- the seven sessions ---------- */
const DAYS = [
{ k:'mon', name:'Monday', title:'Heavy Upper', tone:'heavy', mins:'35–40', run:'easy',
  variants:[
    {a:'Barbell Bench Press', aAlt:{best:'Dumbbell Bench Press', worst:'Deficit Push-Up'},
     b:'Weighted Pull-Up (pronated)', bAlt:{best:'Lat Pulldown', worst:'Band Pulldown'}, wave:'classic'},
    {a:'Incline Dumbbell Press (30–40°)', aAlt:{best:'Incline Barbell Press', worst:'Feet-Elevated Push-Up'},
     b:'Weighted Chin-Up (supinated)', bAlt:{best:'Underhand Pulldown', worst:'Suspension Row'}, wave:'ramp'},
    {a:'Flat DB Press — single / single / double', aAlt:{best:'Machine Chest Press', worst:'Band Chest Press'},
     b:'Neutral-Grip Pull-Up', bAlt:{best:'Neutral-Grip Pulldown', worst:'Suspension Row'}, wave:'pyramid'},
    {a:'Weighted Dip', aAlt:{best:'Dip Machine or Bench Dip', worst:'Parallette / Bench Dip'},
     b:'Close-Grip Lat Pulldown', bAlt:{best:'Close-Grip Pulldown', worst:'Band Pulldown'}, wave:'double'}
  ],
  blocks:[
    {L:'A', type:'Specific Warmup', rounds:2, rest:'60 s', target:'Prepare the primary',
     ex:[{n:'@a', pres:'15, then 12 — Warmup → Light/Medium'}, {n:'Band pull-apart', pres:'20 — Light'}]},
    {L:'B', type:'Superset', wave:1, rest:'2–3 min', target:'Chest, Lats, Triceps',
     ex:[{n:'@a', wave:1, track:1}, {n:'@b', wave:1, track:1}],
     note:'Antagonist pairing — both primaries wave together on one block’s rest.'},
    {L:'C', type:'Giant Set', rounds:3, rest:'90 s', target:'Chest, rear delts, core',
     ex:[{n:'Cable or DB Fly', pres:'12–15 — Medium Plus', track:1},
         {n:'Face Pull', pres:'15 — Medium', track:1},
         {n:'Plank variant', pres:'45–60 s — Bodyweight'}]}
  ]},

{ k:'tue', name:'Tuesday', title:'Pump — Delts', tone:'pump', mins:'20–25', run:'quality',
  variants:[
    {a:'DB Lateral Raise', aAlt:{best:'DB Lateral Raise', worst:'Band Lateral Raise'},
     b:'Bent DB Rear Delt Raise', bAlt:{best:'Reverse Pec Deck', worst:'Band Rear Delt Raise'},
     c:'DB Front Raise', cAlt:{best:'Cable Front Raise', worst:'Band Front Raise'}, wave:'iso'},
    {a:'Single-Arm Cable Lateral Raise', aAlt:{best:'Cable Lateral Raise', worst:'Band Lateral Raise'},
     b:'Cable Rope Face Pull', bAlt:{best:'Rope Face Pull', worst:'Band Face Pull'},
     c:'Cable Front Raise', cAlt:{best:'Cable Front Raise', worst:'Band Front Raise'}, wave:'iso'},
    {a:'DB Lateral Raise with Top Hold', aAlt:{best:'DB Lateral Raise with Top Hold', worst:'Band Raise with Hold'},
     b:'Suspension Rear Delt Fly', bAlt:{best:'Reverse Pec Deck', worst:'Band Pull-Apart'},
     c:'Plate / DB Overhead Hold', cAlt:{best:'Plate Overhead Hold', worst:'Band Overhead Hold'}, wave:'iso'},
    {a:'Band Lateral Raise + drop-set series', aAlt:{best:'DB Lateral Raise + drop set', worst:'Band Lateral Raise + drop set'},
     b:'Band Pull-Apart, high volume', bAlt:{best:'Reverse Pec Deck', worst:'Band Pull-Apart'},
     c:'Band Front Raise', cAlt:{best:'Cable Front Raise', worst:'Band Front Raise'}, wave:'iso'}
  ],
  blocks:[
    {L:'A', type:'Specific Warmup', rounds:1, rest:'30 s', target:'Shoulder prep',
     ex:[{n:'Band pull-apart', pres:'25 — Light'}, {n:'High bent-elbow external rotation', pres:'15 — Light'}]},
    {L:'B', type:'Isolation Wave', wave:1, rest:'60–90 s', target:'Lateral deltoid', iso:1,
     ex:[{n:'@a', wave:1, track:1}],
     note:'Same exercise and same 25 minutes as 3.0. The wave and the terminal failure set are the whole change.'},
    {L:'C', type:'Superset', rounds:3, rest:'45–60 s', target:'Rear and front deltoid',
     ex:[{n:'@b', pres:'15 — Medium Plus', track:1}, {n:'@c', pres:'12 — Light/Medium', track:1}]},
    {L:'D', type:'Finisher', rounds:3, rest:'60 s', target:'Delts, metabolic', fin:1,
     ex:[{n:'Battle rope jumping jacks, shoulder-raise focus', pres:'30 s',
          alt:{best:'Very light DB continuous raises 30 s', worst:'Very light DB continuous raises 30 s'}}]}
  ]},

{ k:'wed', name:'Wednesday', title:'Heavy Lower', tone:'heavy', mins:'45', run:'easy',
  variants:[
    {a:'Safety Bar Squat', aAlt:{best:'Back Squat', worst:'Bodyweight Squat + Band'},
     b:'Conventional Deadlift', bAlt:{best:'Conventional Deadlift', worst:'Single-Leg BW RDL'}, wave:'pyramid', hwave:'classic'},
    {a:'Barbell Front Squat', aAlt:{best:'Front Squat or Hack Squat', worst:'Goblet Squat (DB)'},
     b:'Romanian Deadlift', bAlt:{best:'Romanian Deadlift', worst:'Single-Leg BW RDL'}, wave:'classic', hwave:'ramp'},
    {a:'KB / DB Goblet Squat', aAlt:{best:'Goblet or Hack Squat', worst:'Bodyweight Squat + Band'},

/* ============================================================
   STORAGE
   ============================================================ */
const STORE_KEY = 'hybrid-gorilla-v4';
function load(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } }
function save(d){ try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch {} }
function get(k, dflt){ const v = load()[k]; return v === undefined ? dflt : v; }
function set(k, v){ const d = load(); d[k] = v; save(d); }

/* ============================================================
   ACTION REGISTRY — avoids onclick serialization issues
   ============================================================ */
const _acts = {}; let _actIdx = 0;
function regAction(fn){ const k = 'act' + (_actIdx++); _acts[k] = fn; return k; }
window.triggerAction = function(k){ if (_acts[k]) _acts[k](); };

/* ============================================================
   MODES
   ============================================================ */
let gymMode = 'home';                                   // in-memory by design
window.setGymMode = m => { gymMode = m; render(); };
let scenario = get('scenario', 'maintenance');           // persisted — it's a phase decision
window.setScenario = s => { scenario = s; set('scenario', s); render(); };

/* ============================================================
   BLOCK MATH
   ============================================================ */
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function weeksSince(anchor, d){ return Math.floor((midnight(d) - midnight(anchor)) / 604800000); }

function liftState(d){
  const w = weeksSince(LIFT_ANCHOR, d);
  // Before the anchor: preview week 1 of the ramp block so the app is usable now.
  if (w < 0) return { pre:1, ramp:1, block:0, wk:1, weeks:RAMP_WEEKS, variant:1, deload:0, label:'Ramp Block' };
  if (w < RAMP_WEEKS){
    return { ramp:1, block:0, wk:w+1, weeks:RAMP_WEEKS, variant:w+1,
             deload: w === RAMP_WEEKS-1 ? 1 : 0, label:'Ramp Block' };
  }
  const b = w - RAMP_WEEKS;
  const wk = (b % BLOCK_WEEKS) + 1;
  return { ramp:0, block:Math.floor(b / BLOCK_WEEKS) + 1, wk, weeks:BLOCK_WEEKS,
           variant:((wk-1) % 4) + 1, deload: wk === BLOCK_WEEKS ? 1 : 0,
           label:'Block ' + (Math.floor(b / BLOCK_WEEKS) + 1) };
}
function runState(d){
  const w = Math.max(0, weeksSince(RUN_ANCHOR, d));
  const wk = (w % BLOCK_WEEKS) + 1;
  return { idx: Math.floor(w / BLOCK_WEEKS) % 3, wk, deload: wk === BLOCK_WEEKS ? 1 : 0 };
}
function intensifier(ls){
  if (ls.ramp || ls.deload) return null;               // never during load discovery or deload
  const first = scenario === 'deficit' ? 5 : 3;
  if (ls.wk < first || ls.wk > 7) return null;
  return (ls.wk % 2) ? { t:'Drop set',
      d:'On the last round only: complete the prescription, drop 5–10 lb, continue to failure. Three drops total.' }
    : { t:'Rest-pause',
      d:'On the last round only: take it to failure, rest 15 s, rep out again, rest 15 s, rep out a third time.' };
}

/* Resolve a wave into the rounds actually prescribed today */
function waveRounds(waveKey, ls){
  const w = WAVES[waveKey]; if (!w) return [];
  let r = w.rounds.map((x,i) => ({ ...x, i }));
  if (scenario === 'deficit' && w.drop.length) r = r.filter(x => !w.drop.includes(x.i));
  if (ls.deload){
    r = r.slice(0, 3).map(x => ({ ...x,
      eff: /Heavy|Possible|failure/i.test(x.eff) ? 'Medium Plus' : x.eff, peak:0 }));
  }
  return r;
}
function scaleRounds(n, ls){
  if (ls.deload) return Math.max(1, Math.ceil(n / 2));
  if (scenario === 'deficit') return Math.max(1, n - (n >= 3 ? 1 : 0));
  return n;
}

/* ============================================================
   RENDER HELPERS
   ============================================================ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dayIndexFor(d){ return (d.getDay() + 6) % 7; }   // Mon = 0
function fmt(d){ return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }

function resolveEx(ex, v){
  const out = { ...ex };
  if (typeof out.n === 'string' && out.n[0] === '@'){
    const key = out.n.slice(1);
    out.n = v[key] || out.n;
    const altKey = key + 'Alt';
    if (v[altKey]) out.alt = v[altKey];
  }
  return out;
}
function applyMode(ex){
  if (!ex.alt) return { name: ex.n, altNote:'' };
  if (gymMode === 'travel-best' && ex.alt.best && ex.alt.best !== ex.n)
    return { name: ex.alt.best, altNote:'Travel Best substitute · home: ' + ex.n };
  if (gymMode === 'travel-worst' && ex.alt.worst)
    return { name: ex.alt.worst, altNote:'Travel Worst substitute · home: ' + ex.n };
  return { name: ex.n, altNote:'' };
}

function renderRounds(rounds, sk, auto){
  return `<div class="rounds">` + rounds.map((r, i) => {
    const key = sk + '-r' + i;
    const on = !!get(key, false);
    const act = regAction(() => { set(key, !get(key, false)); render(); });
    return `<div class="rnd${on?' on':''}${r.peak?' peak':''}" onclick="triggerAction('${act}')">
      <span class="rnd-n">R${i+1}</span>
      <span class="rnd-reps">${esc(r.reps)}</span>
      <span class="rnd-eff">${esc(r.eff)}</span>
      <span class="rnd-box">${on?'✓':''}</span>
    </div>`;
  }).join('') + (auto ? `<div class="ex-note">Add load each round until the rep target is unreachable. Stop there.</div>` : '') + `</div>`;
}
function renderTrack(sk){
  const wk = get(sk + '-w', '');
  return `<div class="track">
    <label>Weight</label>
    <input type="number" min="0" step="2.5" placeholder="0" value="${esc(wk)}"
      oninput="set('${sk}-w', this.value)">
    <label>lbs · ${gymMode.replace('travel-','')}</label>
  </div>`;
}

/* ============================================================
   SESSION RENDER
   ============================================================ */
function renderSession(day, ls, dateKey){
  const v = day.variants[ls.variant - 1];
  const intens = intensifier(ls);
  let html = '';

  if (ls.deload) html += `<div class="warnbox"><b>Deload week</b>
    Rounds halved · waves truncated to rounds 1–3 · effort capped at Medium Plus.
    No intensifiers, no set taken to failure. Hold calories — this is when deferred recovery gets taken.</div>`;
  if (ls.ramp && !ls.deload) html += `<div class="warnbox"><b>Ramp block · load discovery</b>
    Intensifiers are off. Use these four weeks to find what Heavy and As Heavy as Possible actually mean
    on each variant — the first full block progresses against these numbers.</div>`;
  if (intens) html += `<div class="intens"><b>Week ${ls.wk} intensifier · ${esc(intens.t)}</b>${esc(intens.d)}
    <br><span style="color:var(--text-dim)">Isolation blocks only — never on a compound.</span></div>`;
  if (day.nolegs) html += `<div class="warnbox"><b>Zero legs</b>
    Follows the long run. No squat, no lunge, no wall sit, no standing calf raise, no jumping, no burpees.</div>`;

  day.blocks.forEach(blk => {
    let rounds = null, roundLabel = '';
    if (blk.wave){
      const key = blk.hinge ? (v.hwave || v.wave) : v.wave;
      rounds = waveRounds(key, ls);
      roundLabel = `${rounds.length} rounds · ${WAVES[key] ? WAVES[key].name : ''}`;
    } else if (blk.sun){
      if (v.wave){ rounds = waveRounds(v.wave, ls); roundLabel = `${rounds.length} rounds · ${v.struct}`; }
      else { roundLabel = v.struct; }
    } else {
      const n = scaleRounds(blk.rounds, ls);
      roundLabel = n + (n === 1 ? ' round' : ' rounds');
    }

    html += `<div class="blk">
      <div class="blk-head">
        <div class="blk-letter">${blk.L}</div>
        <div class="blk-meta">
          <div class="blk-type">${esc(blk.type)}${blk.rounds || rounds ? ' · ' + esc(roundLabel) : ''}</div>
          <div class="blk-rest">Rest ${esc(blk.rest)} between rounds</div>
        </div>
      </div>
      <div class="blk-target">Target: ${esc(blk.target)}</div>`;

    blk.ex.forEach((raw, xi) => {
      const ex = resolveEx(raw, v);
      const m = applyMode(ex);
      const sk = `${dateKey}-${day.k}-${blk.L}-${xi}-${gymMode}`;
      html += `<div class="ex"><div class="ex-top">
        <div class="ex-ord">${xi+1}</div>
        <div style="flex:1;min-width:0">
          <div class="ex-name">${esc(m.name)}</div>
          ${m.altNote ? `<div class="ex-alt">${esc(m.altNote)}</div>` : ''}
          ${ex.pres ? `<div class="ex-pres">${esc(ex.pres)}</div>` : ''}
          ${(!ex.pres && !ex.wave && !ex.sun) ? '' : ''}
        </div></div>`;
      if ((ex.wave || (ex.sun && rounds)) && rounds){
        const key = blk.hinge ? (v.hwave || v.wave) : (blk.sun ? v.wave : v.wave);
        html += renderRounds(rounds, sk, WAVES[key] && WAVES[key].auto);
      } else if (ex.sun && !rounds && v.pres){
        html += `<div class="ex-pres" style="margin-left:26px">${esc(v.pres)}</div>`;
      }
      if (ex.track) html += renderTrack(sk);
      html += `</div>`;
    });

    if (blk.note) html += `<div class="ex" style="padding-top:0"><div class="ex-note">${esc(blk.note)}</div></div>`;
    html += `</div>`;
  });

  const nk = `${dateKey}-${day.k}-notes`;
  html += `<textarea class="notes" placeholder="Session notes — how it felt, what to change next exposure…"
    oninput="set('${nk}', this.value)">${esc(get(nk,''))}</textarea>`;

  const dk = `${dateKey}-${day.k}-done`;
  const done = !!get(dk,false);
  const act = regAction(() => { set(dk, !get(dk,false)); render(); });
  html += `<button class="btn ${done?'done':'primary'}" onclick="triggerAction('${act}')">
    ${done ? '✓ Session complete' : 'Mark session complete'}</button>`;
  return html;
}

/* ============================================================
   RUN LINE
   ============================================================ */
function runFor(day, rs){
  if (day.run === 'quality'){
    const q = RUN_QUALITY[rs.idx][day.k === 'tue' ? 'tue' : 'thu'];
    return { cls:'quality', label:q[0], body:q[1], zone:`Zone ${q[2]} · ${ZONES[q[2]]}` };
  }
  if (day.run === 'long'){
    if (rs.deload) return { cls:'long', label:'3-Mile Time Trial', body:'All out. Recalibrate VDOT zones from the result.', zone:'Race effort' };
    return { cls:'long', label:'Long Run', body:'60–90 min conversational.', zone:`Zone E · ${ZONES.E}` };
  }
  return { cls:'', label:'Easy Run', body:'30–45 min conversational.', zone:`Zone E · ${ZONES.E}` };
}

      <td>${d.name.slice(0,3)}</td>
      <td><b>${esc(d.title)}</b><div style="color:var(--text-dim);font-size:11.5px;margin-top:2px">${esc(v.a)}</div></td>
      <td style="text-align:right;color:var(--text-muted);font-size:11.5px">${esc(r.label)}</td>
    </tr>`;
  }).join('');
  return modeBar() + `<div class="card">
    <div class="day-name">Week ${ls.wk} · ${esc(ls.label)}</div>
    <div class="day-sub">Variant V${ls.variant}${ls.deload?' · deload':''} · ${scenario} round counts</div>
    <table class="wktable" style="margin-top:12px">${rows}</table></div>
    <h2 class="sec">Weekly exposures</h2>
    <div class="card"><table class="wktable">
      <tr><td>Chest</td><td>2 — Monday, Saturday</td></tr>
      <tr><td>Back</td><td>3 — Monday, Friday, Sunday</td></tr>
      <tr><td>Delts</td><td>3 — Tuesday, Friday, Sunday</td></tr>
      <tr><td>Arms</td><td>2 — Thursday, Saturday</td></tr>
      <tr><td>Legs</td><td>1 heavy — Wednesday (+ 7 days running)</td></tr>
    </table></div>`;
}

function viewBlock(){
  const now = new Date();
  const ls = liftState(now), rs = runState(now);
  const n = ls.ramp ? RAMP_WEEKS : BLOCK_WEEKS;
  let cells = '';
  for (let i=1; i<=n; i++){
    const variant = ls.ramp ? i : ((i-1)%4)+1;
    const dl = (i === n);
    cells += `<div class="wkcell${i===ls.wk?' now':''}${dl?' dl':''}">
      <div class="n">${i}</div><div class="v">${dl?'DELOAD':'V'+variant}</div></div>`;
  }
  const ttKey = 'tt-' + (ls.ramp ? 'ramp' : 'b' + ls.block);
  return `<div class="card">
      <div class="day-name">${esc(ls.label)}</div>
      <div class="day-sub">Week ${ls.wk} of ${n} · variant V${ls.variant}</div>
      <div class="blockgrid" style="margin-top:12px">${cells}</div>
      <div class="ex-note" style="margin-top:12px">${ls.ramp
        ? `Each variant is seen once. This block is load discovery — establish what Heavy and As Heavy as Possible
           mean on each variant, then the first full block progresses against these numbers.`
        : `Each variant is seen twice, at weeks N and N+4. The second exposure is the progression target —
           beat the first exposure's top set.`}</div>
    </div>
    <h2 class="sec">Running · out of scope, unchanged</h2>
    <div class="card">
      <div class="day-name" style="font-size:16px">Block ${esc(RUN_BLOCKS[rs.idx])}</div>
      <div class="day-sub">Week ${rs.wk} of 8${rs.deload?' · deload + time trial':''} · anchor Mon Aug 17 2026</div>
      <table class="wktable" style="margin-top:10px">
        <tr><td>E</td><td>Easy — ${ZONES.E}</td></tr>
        <tr><td>T</td><td>Threshold — ${ZONES.T}</td></tr>
        <tr><td>I</td><td>Interval — ${ZONES.I}</td></tr>
        <tr><td>R</td><td>Rep — ${ZONES.R}</td></tr>
      </table>
      <div class="tt"><input placeholder="3-mile TT result (mm:ss)" value="${esc(get(ttKey,''))}"
        oninput="set('${ttKey}', this.value)"></div>
      <div class="ex-note">Recalibrate zones after every time trial.</div>
    </div>`;
}

function viewGuide(){
  const ladder = [
    ['Warmup','Very light. Raise heart rate, prepare the joints.','l1'],
    ['Light / Medium','Easy to control through full range; very strong contraction.','l1'],
    ['Medium to Moderate','Challenging but not overbearing.','l2'],
    ['Medium Plus','Heavy enough to leave a medium comfort zone.','l3'],
    ['Heavy','You should be able to complete about 2 more reps than prescribed.','l4'],
    ['As Heavy as Possible','You should NOT be able to complete even one rep beyond the prescription.','l5'],
    ['To Failure','The point at which a rep can no longer be completed with good form.','l6']
  ];
  const waves = ['classic','ramp','pyramid','double','iso'].map(k => {
    const w = WAVES[k];
    return `<div class="card"><div class="day-name" style="font-size:15px">${esc(w.name)}</div>
      <div class="rounds" style="margin-left:0">${w.rounds.map((r,i) =>
        `<div class="rnd${r.peak?' peak':''}"><span class="rnd-n">R${i+1}</span>
          <span class="rnd-reps">${esc(r.reps)}</span><span class="rnd-eff">${esc(r.eff)}</span></div>`).join('')}</div></div>`;
  }).join('');
  return `<div class="ref">
    <h2 class="sec">Effort ladder — replaces RIR</h2>
    <div class="card"><div class="lad">${ladder.map(([n,d,c]) =>
      `<div class="lad-row ${c}"><b>${esc(n)}</b><span>${esc(d)}</span></div>`).join('')}</div></div>
    <h2 class="sec">Wave shapes</h2>${waves}
    <h2 class="sec">Block types</h2>
    <div class="card"><table class="wktable">
      <tr><td>SS</td><td><b>Superset</b> — two movements back to back, no rest</td></tr>
      <tr><td>GS</td><td><b>Giant Set</b> — three or more back to back, no rest</td></tr>
      <tr><td>SEQ</td><td><b>Sequence</b> — a fixed pattern repeated for rounds</td></tr>
      <tr><td>FIN</td><td><b>Finisher</b> — terminal; reinforces contraction and exhausts what was trained</td></tr>
      <tr><td>WU</td><td><b>Specific Warmup</b> — its own block, drawn from the session's primary</td></tr>
    </table></div>
    <h2 class="sec">Standing rules</h2>
    <div class="card"><table class="wktable">
      <tr><td>1</td><td>Hard leg work only ever lands before an easy run. Heavy lower stays Wednesday.</td></tr>
      <tr><td>2</td><td>Saturday gets zero leg work. The long run is the leg work.</td></tr>
      <tr><td>3</td><td>Intensifiers on isolation only — never on a compound.</td></tr>
      <tr><td>4</td><td>Deload is week 8 and it is mandatory. Do not cut calories during it.</td></tr>
      <tr><td>5</td><td>Free weights and cables are prescribed. Landmine is an alternate, never a prescription.</td></tr>
    </table></div></div>`;
}

/* ============================================================
   SHELL
   ============================================================ */
function render(){
  const now = new Date();
  const ls = liftState(now), rs = runState(now);
  document.getElementById('chip').innerHTML = ls.pre
    ? `<strong>Opens Sep 14</strong>Preview · week 1 · V1`
    : `<strong>${esc(ls.label)}</strong>Week ${ls.wk} · V${ls.variant}`;
  document.getElementById('status').innerHTML =
    `<span>${scenario}</span><span class="sep">·</span>
     <span>${gymMode.replace('travel-','travel ')}</span><span class="sep">·</span>
     <span>Run ${esc(RUN_BLOCKS[rs.idx])} wk${rs.wk}</span>
     ${ls.deload ? '<span class="sep">·</span><span style="color:var(--warn)">Deload</span>' : ''}`;
  const total = ls.ramp ? RAMP_WEEKS : BLOCK_WEEKS;
  document.getElementById('prog').style.width = Math.round((ls.wk/total)*100) + '%';
  document.getElementById('tabs').innerHTML = TABS.map(([k,l]) =>
    `<button class="tab${tab===k?' active':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  document.getElementById('view').innerHTML =
    tab === 'today' ? viewToday() : tab === 'week' ? viewWeek() : tab === 'block' ? viewBlock() : viewGuide();
  document.getElementById('footdate').textContent = fmt(now);
}
window.setTab = t => { tab = t; window.scrollTo(0,0); render(); };
window.set = set;
window.closeModal = () => document.getElementById('modal').classList.remove('open');
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) window.closeModal();
});
render();
</script>
</body>
</html>
